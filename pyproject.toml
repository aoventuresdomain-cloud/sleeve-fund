[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeve-fund"
version = "0.1.0"
description = "Sleeve Fund: research loop and paper trading on NautilusTrader"
requires-python = ">=3.12,<3.14"
# NautilusTrader 2.x is the first line with a Kraken adapter. It is a release
# candidate: fine for research and paper, re-check before any live money (G2).
dependencies = [
    "nautilus_trader==2.0.0rc5",
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "alembic>=1.13",  # schema migrations and the live-schema drift check (sleeve_fund.schema)
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.45"]

[tool.setuptools.packages.find]
include = ["sleeve_fund*"]

[tool.setuptools.package-data]
"sleeve_fund.dashboard" = ["templates/*.html", "static/*", "static/fonts/*"]
"sleeve_fund.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "strategy_errors: the test makes a strategy raise on purpose, to check the errors are reported",
    "sanity: fast arithmetic checks on fees, sizing, the books, R and paper-backtest parity (pytest -m sanity)",
    "no_open_risk_limit: a paper mechanics test with a stopless perp above 1x; lifts the open-risk limit (open_risk.LIMIT)",
    "real_daily_atr: the test reads the daily ATR from the history store itself (open_risk.history_atr_pct)",
    "no_perp_stop_check: a liquidation mechanics test with a stopless perp above 1x; lifts strategies.check_perp_stop",
]
