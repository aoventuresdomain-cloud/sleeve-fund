name: canon
# P1-1-CANON backfill: make the stored 1-minute history since a date the venue's own candles
# (python -m sleeve_fund.history canon), in a one-off container of the venue's hub (same image, volume and env, so a
# deploy that recreates the hub doesn't kill it) on the paper server. Run it by hand from main,
# once and on purpose (HoE): first with dry_run (the default), which only counts the minutes it would replace and fill
# per instrument; then, on the HoE's go, without. It reads the venue's public candles and writes only the history files
# (each replacement recorded in provenance with both values). Same secrets and variable as parity and status.
on:
  workflow_dispatch:
    inputs:
      venue:
        description: Venue whose stored history to make canonical (lower-case letters only)
        required: true
        default: binance
      since:
        description: UTC date to start from (YYYY-MM-DD)
        required: true
        default: "2026-10-06"
      until:
        description: UTC minute to stop before (YYYY-MM-DDTHH:MM), so the dry run and the real run cover the same window; empty for up to the newest closed minute
        required: false
        default: ""
      pairs:
        description: Instruments, space-separated, e.g. BTC/USDT ETH/USDT; empty for the core list and every Strategy's
        required: false
        default: ""
      dry_run:
        description: Count only, write nothing
        type: boolean
        required: true
        default: true
# One history writer at a time, across canon and funding-backfill: a queued run waits for the running one.
concurrency: { group: history-writer, cancel-in-progress: false }
jobs:
  canon:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    env:
      USER_AT: ${{ vars.DEPLOY_USER || 'root' }}
    steps:
      - name: Check the inputs
        env:
          VENUE: ${{ inputs.venue }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          PAIRS: ${{ inputs.pairs }}
        run: |
          [[ "$VENUE" =~ ^[a-z]{1,32}$ ]] || { echo "venue must be lower-case letters only"; exit 1; }
          [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "since must be YYYY-MM-DD"; exit 1; }
          [[ -z "$UNTIL" || "$UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$ ]] || { echo "until must be YYYY-MM-DDTHH:MM"; exit 1; }
          [[ -z "$PAIRS" || "$PAIRS" =~ ^[A-Z0-9]{1,16}/[A-Z0-9]{1,16}( [A-Z0-9]{1,16}/[A-Z0-9]{1,16})*$ ]] || { echo "pairs must be like BTC/USDT ETH/USDT"; exit 1; }
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Refuse to stack a second history writer
        # A one-off container can outlive its job (an SSH drop, a cancelled run), so a run still going is shown and
        # this job stops rather than start another writer on the same files.
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy "$USER_AT@$HOST" \
            'running=$(sudo docker ps --filter name=canon- --filter name=backfill- --format "{{.Names}} {{.Status}}"); if [ -n "$running" ]; then echo "a history writer is still running:"; echo "$running"; exit 1; fi'
      - name: Run the backfill
        # Keep-alives: canon prints nothing until an instrument is done, and the runner's network drops an SSH
        # session idle for ~4 min (run 38477676309 died at 5 min with "Broken pipe"); -u prints each line as it lands.
        env:
          RUN_ID: ${{ github.run_id }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          VENUE: ${{ inputs.venue }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until && format('--until {0}', inputs.until) || '' }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
          PAIRS: ${{ inputs.pairs }}
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$USER_AT@$HOST" \
            "cd /opt/sleeve-fund && sudo docker compose run --rm -T --no-deps --name canon-$RUN_ID hub-$VENUE python -u -m sleeve_fund.history canon --venue $VENUE --since $SINCE $UNTIL $DRY $PAIRS"
