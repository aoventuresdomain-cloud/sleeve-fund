name: golden-export
# GOLDEN-VENUE: export stored 1-minute candles for the golden fixtures (python -m sleeve_fund.history export), inside the
# venue's hub container on the paper server. Read-only: it reads the history files and writes nothing on the server.
# Run it by hand from main, once the Data Architect has picked the window. For each instrument it exports the candles
# and the canon backfill's replacement records in the window (refused unless their count is the canon run's), then
# gzips both and uploads them as this run's artifact with a sha256 list, for the fixture PR. Same secrets and variable
# as canon. With print_fixtures, a separate read-only job also prints each .csv.gz base64-encoded in its log, between
# BEGIN and END lines, for sessions that can read job logs but cannot download artifacts; the fixture PR re-checks
# every decoded file against SHA256SUMS, so a cut or garbled log fails instead of passing.
on:
  workflow_dispatch:
    inputs:
      venue:
        description: Venue whose stored history to export (lower-case letters only)
        required: true
        default: binance
      pairs:
        description: Instruments, comma-separated, e.g. BTC/USDT,ETH/USDT
        required: true
      start:
        description: First minute's open time, UTC (YYYY-MM-DDTHH:MM)
        required: true
      end:
        description: UTC minute to stop before (YYYY-MM-DDTHH:MM)
        required: true
      expect_replaced:
        description: The canon run's replaced count per instrument, comma-separated in the same order as pairs
        required: true
      print_fixtures:
        description: Also print the files base64-encoded in a separate job's log (read-only)
        type: boolean
        required: true
        default: false
jobs:
  export:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    env:
      USER_AT: ${{ vars.DEPLOY_USER || 'root' }}
    steps:
      - name: Check the inputs
        env:
          VENUE: ${{ inputs.venue }}
          PAIRS: ${{ inputs.pairs }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          EXPECT: ${{ inputs.expect_replaced }}
        run: |
          [[ "$VENUE" =~ ^[a-z]{1,32}$ ]] || { echo "venue must be lower-case letters only"; exit 1; }
          [[ "$PAIRS" =~ ^[A-Z0-9]{1,20}/[A-Z0-9]{1,20}(,[A-Z0-9]{1,20}/[A-Z0-9]{1,20}){0,19}$ ]] \
            || { echo "pairs must be like BTC/USDT,ETH/USDT (upper-case, comma-separated, at most 20)"; exit 1; }
          for t in "$START" "$END"; do
            [[ "$t" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$ ]] || { echo "start and end must be YYYY-MM-DDTHH:MM"; exit 1; }
          done
          [[ "$START" < "$END" ]] || { echo "start must be before end"; exit 1; }
          [[ "$EXPECT" =~ ^[0-9]{1,7}(,[0-9]{1,7}){0,19}$ ]] || { echo "expect_replaced must be counts like 1500,1582"; exit 1; }
          [[ $(tr -cd , <<< "$PAIRS" | wc -c) == $(tr -cd , <<< "$EXPECT" | wc -c) ]] \
            || { echo "expect_replaced needs one count per instrument"; exit 1; }
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Export each instrument
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          VENUE: ${{ inputs.venue }}
          PAIRS: ${{ inputs.pairs }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          EXPECT: ${{ inputs.expect_replaced }}
        run: |
          set -euo pipefail
          mkdir -p golden
          IFS=, read -ra LIST <<< "$PAIRS"
          IFS=, read -ra COUNTS <<< "$EXPECT"
          for i in "${!LIST[@]}"; do
            PAIR="${LIST[$i]}"
            BASE="$VENUE-$(echo "$PAIR" | tr '[:upper:]/' '[:lower:]-')-${START//:/}-${END//:/}"
            RUN="cd /opt/sleeve-fund && sudo docker compose exec -T hub-$VENUE python -m sleeve_fund.history export --venue $VENUE --start $START --end $END $PAIR"
            ssh -i ~/.ssh/id_deploy "$USER_AT@$HOST" "$RUN" > "golden/$BASE.csv"
            ssh -i ~/.ssh/id_deploy "$USER_AT@$HOST" "$RUN --canon-replaced --expect ${COUNTS[$i]}" > "golden/$BASE-canon.csv"
            echo "$PAIR: $(($(wc -l < "golden/$BASE.csv") - 1)) minutes, $(($(wc -l < "golden/$BASE-canon.csv") - 1)) canon replacements"
          done
          cd golden
          sha256sum -- *.csv | tee SHA256SUMS
          gzip -n -- *.csv
      - name: Upload the fixtures
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ inputs.venue }}-${{ github.run_id }}
          path: golden/
          if-no-files-found: error
          retention-days: 30
  print:
    needs: export
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    if: ${{ inputs.print_fixtures }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: golden-${{ inputs.venue }}-${{ github.run_id }}
          path: golden-dl
      - name: Print the files base64-encoded
        run: |
          set -euo pipefail
          cd golden-dl
          cat SHA256SUMS
          for f in *.csv.gz; do
            echo "BEGIN $f $(sha256sum < "$f" | cut -d' ' -f1) $(stat -c %s "$f")"
            base64 -w 1000 < "$f"
            echo "END $f"
          done
