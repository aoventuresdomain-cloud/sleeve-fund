name: taker-backfill
# R-22: the venue's taker-buy volume for the minutes a history store holds, from a date up to a date, read from the
# venue's public 1-minute candles (python -m sleeve_fund.history taker-backfill) in a one-off container of the venue's
# hub on the paper server, and kept beside the minutes in taker_buy/YYYY-MM.npz: no candle file is rewritten. Only
# adds: a kept figure is never changed. Run it by hand from main, once and on purpose: first with dry_run (the
# default), which only counts the minutes it would add per instrument; then, on the PM's go, without, over the same
# window, whose counts must equal the dry run's. A 5-year instrument reads about 1,750 pages (about 25 minutes).
# Fails when an instrument's pages ran out before the window's end. Same secrets and variable as funding-backfill.
on:
  workflow_dispatch:
    inputs:
      venue:
        description: Venue whose stored minutes to add taker-buy volume to (lower-case letters only)
        required: true
        default: binance
      since:
        description: UTC date to start from (YYYY-MM-DD)
        required: true
      until:
        description: UTC date to stop before (YYYY-MM-DD), the same for the dry run and the real run
        required: true
      pairs:
        description: Instruments, space-separated, e.g. BTC/USDT ETH/USDT; empty for the core list and every Strategy's
        required: false
        default: ""
      dry_run:
        description: Count only, write nothing
        type: boolean
        required: true
        default: true
# One history writer at a time, across canon, funding-backfill and taker-backfill: a queued run waits for the running one.
concurrency: { group: history-writer, cancel-in-progress: false }
jobs:
  taker-backfill:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    env:
      USER_AT: ${{ vars.DEPLOY_USER || 'root' }}
    steps:
      - name: Check the inputs
        env:
          VENUE: ${{ inputs.venue }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          PAIRS: ${{ inputs.pairs }}
        run: |
          [[ "$VENUE" =~ ^[a-z]{1,32}$ ]] || { echo "venue must be lower-case letters only"; exit 1; }
          [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "since must be YYYY-MM-DD"; exit 1; }
          [[ "$UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "until must be YYYY-MM-DD"; exit 1; }
          [[ -z "$PAIRS" || "$PAIRS" =~ ^[A-Z0-9]{1,16}/[A-Z0-9]{1,16}( [A-Z0-9]{1,16}/[A-Z0-9]{1,16})*$ ]] || { echo "pairs must be like BTC/USDT ETH/USDT"; exit 1; }
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Refuse to stack a second history writer
        # A one-off container can outlive its job (an SSH drop, a cancelled run), so a run still going is shown and
        # this job stops rather than start another writer on the same files.
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy "$USER_AT@$HOST" \
            'running=$(sudo docker ps --filter name=canon- --filter name=backfill- --format "{{.Names}} {{.Status}}"); if [ -n "$running" ]; then echo "a history writer is still running:"; echo "$running"; exit 1; fi'
      - name: Add the taker-buy volume
        env:
          RUN_ID: ${{ github.run_id }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          VENUE: ${{ inputs.venue }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          PAIRS: ${{ inputs.pairs }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$USER_AT@$HOST" \
            "cd /opt/sleeve-fund && sudo docker compose run --rm -T --no-deps --name backfill-$RUN_ID hub-$VENUE python -u -m sleeve_fund.history taker-backfill --venue $VENUE --since $SINCE --until $UNTIL $DRY $PAIRS"
