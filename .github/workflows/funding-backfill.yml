name: funding-backfill
# FUNDING-BACKFILL (START CHECKLIST 5): the settled funding a perpetual's history store lacks from a date up to its
# newest kept rate, asked of the venue's public funding history (python -m sleeve_fund.history funding-backfill),
# inside the venue's hub container on the paper server. Only adds: a kept rate is never changed or removed. Run it by
# hand from main, once and on purpose (HoE): first with dry_run (the default), which only counts the settlements it
# would add per instrument; then, on the HoE's go, without, whose counts must equal the dry run's. Fails when an
# instrument's pages ran out before its newest kept rate. Same secrets and variable as canon and history-coverage.
on:
  workflow_dispatch:
    inputs:
      venue:
        description: Venue whose stored funding to fill (lower-case letters only)
        required: true
        default: binance
      since:
        description: UTC date to start from (YYYY-MM-DD)
        required: true
      pairs:
        description: Instruments, space-separated, e.g. BTC/USDT ETH/USDT; empty for the core list and every Strategy's
        required: false
        default: ""
      dry_run:
        description: Count only, write nothing
        type: boolean
        required: true
        default: true
jobs:
  funding-backfill:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    env:
      USER_AT: ${{ vars.DEPLOY_USER || 'root' }}
    steps:
      - name: Check the inputs
        env:
          VENUE: ${{ inputs.venue }}
          SINCE: ${{ inputs.since }}
          PAIRS: ${{ inputs.pairs }}
        run: |
          [[ "$VENUE" =~ ^[a-z]{1,32}$ ]] || { echo "venue must be lower-case letters only"; exit 1; }
          [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "since must be YYYY-MM-DD"; exit 1; }
          [[ -z "$PAIRS" || "$PAIRS" =~ ^[A-Z0-9]{1,16}/[A-Z0-9]{1,16}( [A-Z0-9]{1,16}/[A-Z0-9]{1,16})*$ ]] || { echo "pairs must be like BTC/USDT ETH/USDT"; exit 1; }
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Fill the funding
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          VENUE: ${{ inputs.venue }}
          SINCE: ${{ inputs.since }}
          PAIRS: ${{ inputs.pairs }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$USER_AT@$HOST" \
            "cd /opt/sleeve-fund && sudo docker compose exec -T hub-$VENUE python -u -m sleeve_fund.history funding-backfill --venue $VENUE --since $SINCE $DRY $PAIRS"
