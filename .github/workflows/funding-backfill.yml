name: funding-backfill
# FUNDING-BACKFILL (START CHECKLIST 5): the settled funding a perpetual's history store lacks from a date up to its
# newest kept rate, asked of the venue's public funding history (python -m sleeve_fund.history funding-backfill),
# in a one-off container of the venue's hub (a deploy that recreates the hub doesn't kill it) on the paper server.
# Only adds: a kept rate is never changed or removed. Run it by hand from main, once and on purpose (HoE): first with
# dry_run (the default), which only counts the settlements it would add per instrument; then, on the HoE's go,
# without, whose counts must equal the dry run's. Fails when an instrument's pages ran out before its newest kept rate. Same secrets and variable as canon and history-coverage.
on:
  workflow_dispatch:
    inputs:
      venue:
        description: Venue whose stored funding to fill (lower-case letters only)
        required: true
        default: binance
      since:
        description: UTC date to start from (YYYY-MM-DD)
        required: true
      pairs:
        description: Instruments, space-separated, e.g. BTC/USDT ETH/USDT; empty for the core list and every Strategy's
        required: false
        default: ""
      dry_run:
        description: Count only, write nothing
        type: boolean
        required: true
        default: true
# One history writer at a time, across canon and funding-backfill: a queued run waits for the running one.
concurrency: { group: history-writer, cancel-in-progress: false }
jobs:
  funding-backfill:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    env:
      USER_AT: ${{ vars.DEPLOY_USER || 'root' }}
    steps:
      - name: Check the inputs
        env:
          VENUE: ${{ inputs.venue }}
          SINCE: ${{ inputs.since }}
          PAIRS: ${{ inputs.pairs }}
        run: |
          [[ "$VENUE" =~ ^[a-z]{1,32}$ ]] || { echo "venue must be lower-case letters only"; exit 1; }
          [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "since must be YYYY-MM-DD"; exit 1; }
          [[ -z "$PAIRS" || "$PAIRS" =~ ^[A-Z0-9]{1,16}/[A-Z0-9]{1,16}( [A-Z0-9]{1,16}/[A-Z0-9]{1,16})*$ ]] || { echo "pairs must be like BTC/USDT ETH/USDT"; exit 1; }
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Refuse to stack a second history writer
        # A one-off container can outlive its job (an SSH drop, a cancelled run), so a run still going is shown and
        # this job stops rather than start another writer on the same files.
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy "$USER_AT@$HOST" \
            'running=$(sudo docker ps --filter name=canon- --filter name=backfill- --format "{{.Names}} {{.Status}}"); if [ -n "$running" ]; then echo "a history writer is still running:"; echo "$running"; exit 1; fi'
      - name: Fill the funding
        env:
          RUN_ID: ${{ github.run_id }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          VENUE: ${{ inputs.venue }}
          SINCE: ${{ inputs.since }}
          PAIRS: ${{ inputs.pairs }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$USER_AT@$HOST" \
            "cd /opt/sleeve-fund && sudo docker compose run --rm -T --no-deps --name backfill-$RUN_ID hub-$VENUE python -u -m sleeve_fund.history funding-backfill --venue $VENUE --since $SINCE $DRY $PAIRS"
