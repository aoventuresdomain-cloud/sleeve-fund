name: regime-backfill
# P2-5 regime data (python -m sleeve_fund.regime_load backfill), inside the venue's hub container on the paper server:
# books the venue's perpetual listing and every contract only its public archive holds (delisted included) into
# instruments, each contract's closed daily bars after the newest held into daily_bars, then the universe and the
# regime series for every day through `end` (default today, UTC). Every table is write-once: a rerun writes only new
# days, and a day that comes out differently from the row held is refused, never rewritten. Run by hand from main
# (HoE); the first run is the backfill, later runs the nightly append. Reads only public market data.
on:
  workflow_dispatch:
    inputs:
      venue:
        description: Reference venue (lower-case letters only)
        required: true
        default: binance
      end:
        description: Last day to write (YYYY-MM-DD, UTC); empty for today
        required: false
        default: ""
jobs:
  regime:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions: { contents: read }
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    env:
      USER_AT: ${{ vars.DEPLOY_USER || 'root' }}
    steps:
      - name: Check the inputs
        env:
          VENUE: ${{ inputs.venue }}
          END: ${{ inputs.end }}
        run: |
          [[ "$VENUE" =~ ^[a-z]{1,32}$ ]] || { echo "venue must be lower-case letters only"; exit 1; }
          [[ -z "$END" || "$END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "end must be YYYY-MM-DD"; exit 1; }
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Load the daily bars and write the series
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          VENUE: ${{ inputs.venue }}
          END: ${{ inputs.end && format('--end {0}', inputs.end) || '' }}
        run: |
          ssh -i ~/.ssh/id_deploy "$USER_AT@$HOST" \
            "cd /opt/sleeve-fund && sudo docker compose exec -T hub-$VENUE python -m sleeve_fund.regime_load backfill --venue $VENUE $END"
