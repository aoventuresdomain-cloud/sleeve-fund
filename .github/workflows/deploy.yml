name: deploy
# Ships main to the paper server. Needs repository secrets:
#   DEPLOY_HOST          server IP or hostname
#   DEPLOY_SSH_KEY       private key whose public half is in the server's authorized_keys
# Optional variable DEPLOY_USER: login user (default root; AWS Lightsail Ubuntu uses ubuntu, with sudo).
#   DASHBOARD_PASSWORD   the PM dashboard password (letters and digits; no $)
# Optional: SITE_ADDRESS (defaults to <DEPLOY_HOST>.sslip.io for free HTTPS without a domain).
# Optional: ALERT_WEBHOOK_URL and HEALTHCHECK_PING_URL (see sleeve_fund/alerts.py).
# No exchange credentials are involved: this stack is paper only.
# Deploys only main, and only a commit whose tests passed: it runs when the tests workflow finishes
# green on a push to main, and a manual run (from main only) checks that the push run passed on the
# commit it ships. The repository variable DEPLOY_ENABLED=true gates both.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions: { contents: read, actions: read }
    env:
      USER_AT: ${{ vars.DEPLOY_USER || 'root' }}
    if: >-
      ${{ vars.DEPLOY_ENABLED == 'true' &&
          ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
           (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}  # exactly the commit that was tested
      - name: Require green tests for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The push run on main, not a pull request's run, so nothing unmerged can ship.
          ok=$(gh run list --workflow tests.yml --commit "$GITHUB_SHA" --branch main --event push --status success \
               --json databaseId --jq length)
          [ "$ok" -gt 0 ] || { echo "FAIL: the tests have not passed on main at $GITHUB_SHA; wait for the tests workflow"; exit 1; }
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Ship code
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # sudo is a no-op for root and needed for a non-root user such as Lightsail's ubuntu.
          ssh -i ~/.ssh/id_deploy "$USER_AT@$HOST" 'sudo mkdir -p /opt/sleeve-fund'
          rsync -az --delete --exclude .git --exclude .env --exclude kraken.env --exclude data --rsync-path="sudo rsync" \
            -e "ssh -i ~/.ssh/id_deploy" ./ "$USER_AT@$HOST":/opt/sleeve-fund/
      - name: Start stack
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          SITE="${SITE_ADDRESS:-$HOST.sslip.io}"
          # Secrets go over stdin, never on a command line.
          printf 'export DASHBOARD_PASSWORD=%q SITE_ADDRESS=%q ALERT_WEBHOOK_URL=%q HEALTHCHECK_PING_URL=%q\n' \
            "$DASHBOARD_PASSWORD" "$SITE" "$ALERT_WEBHOOK_URL" "$HEALTHCHECK_PING_URL" | \
            ssh -i ~/.ssh/id_deploy "$USER_AT@$HOST" 'eval "$(cat)"; sudo --preserve-env=DASHBOARD_PASSWORD,SITE_ADDRESS,ALERT_WEBHOOK_URL,HEALTHCHECK_PING_URL bash /opt/sleeve-fund/deploy/remote_up.sh'
          echo "Dashboard: https://$SITE"
      - name: Check the sleeves are live
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Give the sleeves time to connect to Kraken and report, then read the journal.
          sleep 150
          ssh -i ~/.ssh/id_deploy "$USER_AT@$HOST" 'cd /opt/sleeve-fund && sudo docker compose ps -a && sudo docker compose logs --no-color --tail 40 caddy dashboard && sudo grep SITE_ADDRESS .env && curl -s -o /dev/null -w "dashboard via caddy on the server: %{http_code}\n" -k --resolve "$(sudo grep SITE_ADDRESS .env | cut -d= -f2):443:127.0.0.1" "https://$(sudo grep SITE_ADDRESS .env | cut -d= -f2)/healthz" || true'
          curl -s -m 20 -o /dev/null -w "dashboard from the internet: %{http_code}\n" "https://$HOST.sslip.io/healthz" || echo "dashboard from the internet: unreachable"
          ssh -i ~/.ssh/id_deploy "$USER_AT@$HOST" 'cd /opt/sleeve-fund && sudo docker compose exec -T db psql -U sleeve -d sleeve_fund -tA -F " | " -c "
            select name, instrument, status, heartbeat_at from sleeves order by id;
            select count(*) as marks_last_5_min from equity where ts > now() - interval '"'"'5 minutes'"'"';
            select ts, sleeve, level, kind, message from events where level <> '"'"'info'"'"' order by id desc limit 10;"' | tee health.txt
          LIVE=$(ssh -i ~/.ssh/id_deploy "$USER_AT@$HOST" 'cd /opt/sleeve-fund && sudo docker compose exec -T db psql -U sleeve -d sleeve_fund -tAc "select count(*) from sleeves where desired_state = '"'"'running'"'"' and (heartbeat_at is null or heartbeat_at < now() - interval '"'"'3 minutes'"'"')"')
          echo "running sleeves not reporting: $LIVE"
          [ "$LIVE" = "0" ] || { echo "FAIL: some running sleeves are not reporting"; exit 1; }
