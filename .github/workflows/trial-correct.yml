name: trial-correct
# TRIAL-CORRECT (Advisor, B0's ruling 31 Oct; the DA's five conditions): one correcting row for a counted basket try
# whose register Sharpe was the close-priced comparison's, not its book's. The register is write-once (migration
# 0018), so the wrong row stays and one more row of the same variant carries the sheet's book Sharpe
# (python -m sleeve_fund.research.trial_correction, which refuses unless the row and the sheet are one try's).
# A dry run unless apply is ticked: the dry run reads only. With apply it is a write to the live database, run only on
# the HoE's dispatch with the PM's word for that row. It shares the study runs' concurrency group, so it never runs
# beside one. The report holds Sharpes and ids, so it is encrypted on the runner to the project's key, as
# trials-export's; the public log shows the outcome's first word and byte counts only, beside the dispatch's own
# inputs (the row id and sheet stem, as sheet-export shows its stem; neither is a figure). Run it by hand from main.
# After an apply: append the decrypted report's "trail:" line to research/accuracy-checks/trials-corrections.md
# in the project folder (the register can't mark a correction, and its Sharpes and ids stay out of this public repo).
on:
  workflow_dispatch:
    inputs:
      row:
        description: The counted basket try's trials id (16 hex characters)
        required: true
      sheet:
        description: Its tear sheet's file stem, without .md
        required: true
      apply:
        description: Write the correcting row (unticked, a dry run that writes nothing)
        type: boolean
        required: true
        default: false
concurrency: { group: study, cancel-in-progress: false }
jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read }
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    env:
      USER_AT: ${{ vars.DEPLOY_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the inputs
        env:
          ROW: ${{ inputs.row }}
          SHEET: ${{ inputs.sheet }}
        run: |
          [[ "$ROW" =~ ^[0-9a-f]{16}$ ]] || { echo "row must be a 16-character trials id"; exit 1; }
          [[ "$SHEET" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,199}$ && "$SHEET" != *..* ]] \
            || { echo "sheet must be a tear-sheet file stem: letters, digits, _ - . only, no / or .., at most 200"; exit 1; }
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Correct the row
        env:
          RUN_ID: ${{ github.run_id }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          ROW: ${{ inputs.row }}
          SHEET: ${{ inputs.sheet }}
          APPLY: ${{ inputs.apply && '--apply' || '' }}
        run: |
          set -uo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/plain"
          code=0  # the runner's shell has -e: a refusal must still reach the encrypted report, so it is caught here
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$USER_AT@$HOST" \
            "cd /opt/sleeve-fund && sudo docker compose run --rm -T --no-deps --name trial-correct-$RUN_ID dashboard \
              python -m sleeve_fund.research.trial_correction --row $ROW --sheet $SHEET $APPLY" \
            > "$RUNNER_TEMP/plain/report.txt" 2>&1 || code=$?
          # The outcome's first word only (the last line: dry, written, refused, CHECK), never a figure or an id
          echo "outcome: $(tail -n 1 "$RUNNER_TEMP/plain/report.txt" | grep -oE '^(dry|written|refused|CHECK|trail)' || echo other), exit $code"
          tar -czf "$RUNNER_TEMP/plain/sheet.tar.gz" -C "$RUNNER_TEMP/plain" report.txt
          echo "$code" > "$RUNNER_TEMP/code"
      - name: Encrypt
        run: |
          # As trials-export: a fresh random key encrypts the archive; the project's public key (RSA-OAEP, SHA-256) wraps it.
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/out"
          openssl rand -hex 32 > "$RUNNER_TEMP/plain/key.hex"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/plain/sheet.tar.gz" -out "$RUNNER_TEMP/out/sheet.tar.gz.enc" -pass "file:$RUNNER_TEMP/plain/key.hex"
          openssl pkeyutl -encrypt -pubin -inkey deploy/keys/sheet-export.pub.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/plain/key.hex" -out "$RUNNER_TEMP/out/key.bin.enc"
          rm -rf -- "$RUNNER_TEMP/plain"
          for f in "$RUNNER_TEMP"/out/*; do echo "$(basename "$f") $(stat -c %s "$f") bytes"; done
      - uses: actions/upload-artifact@v4
        with:
          name: trial-correct-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 3
          if-no-files-found: error
      - name: The script's outcome
        run: exit "$(cat "$RUNNER_TEMP/code")"
      - name: Clean up
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/plain" "$RUNNER_TEMP/out" "$RUNNER_TEMP/code" ~/.ssh/id_deploy
