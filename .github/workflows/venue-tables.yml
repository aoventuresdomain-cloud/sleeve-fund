name: venue-tables
# PAPER-TIERS-3 (PM yes 21 Oct 17:54 UK; Advisor): the paper venue's published maintenance tiers and instrument info
# (tick, lot, funding caps) for the pool, read in one pass so every pair shares one read date. Read-only: public
# market endpoints, no key, no orders, writes nothing on the server. It runs on the paper server, because the venue
# refuses the runners' region; the raw replies come back as this run's artifact. Run it by hand from main (HoE).
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Linear symbols, space-separated
        required: true
        default: BTCUSDT ETHUSDT SOLUSDT XRPUSDT
jobs:
  tables:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    env:
      USER_AT: ${{ vars.DEPLOY_USER || 'root' }}
    steps:
      - name: Check the inputs
        env:
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          [[ "$SYMBOLS" =~ ^[A-Z0-9]{2,20}( [A-Z0-9]{2,20}){0,9}$ ]] || { echo "symbols must be like BTCUSDT ETHUSDT"; exit 1; }
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Read the tables
        # Each reply is printed between markers and split into files here; a risk-limit reply with a next page is
        # followed until its cursor is empty. Public GETs only, from the hub container (it has the server's route out).
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          mkdir -p out
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$USER_AT@$HOST" \
            "cd /opt/sleeve-fund && sudo docker compose exec -T hub-binance python -u - $SYMBOLS" > out/raw.txt <<'PY'
          import datetime, json, sys, urllib.parse, urllib.request
          BASE = "https://api.bybit.com/v5/market/"
          print("READ_AT_UTC", datetime.datetime.now(datetime.UTC).isoformat(timespec="seconds"))
          def get(path, **q):
              with urllib.request.urlopen(BASE + path + "?" + urllib.parse.urlencode(q), timeout=30) as r:
                  return r.read().decode()
          for s in sys.argv[1:]:
              cursor, page = "", 1
              while True:
                  q = dict(category="linear", symbol=s, **({"cursor": cursor} if cursor else {}))
                  body = get("risk-limit", **q)
                  print(f"=== risk-limit-{s}-p{page}.json"); print(body)
                  cursor = (json.loads(body).get("result") or {}).get("nextPageCursor") or ""
                  if not cursor or page >= 10:
                      break
                  page += 1
              print(f"=== instruments-info-{s}.json"); print(get("instruments-info", category="linear", symbol=s))
          PY
          awk '/^READ_AT_UTC /{print > "out/read-at.txt"; next} /^=== /{f="out/"$2; next} f{print > f}' out/raw.txt
          rm out/raw.txt
          cat out/read-at.txt; ls -l out
          for f in out/*.json; do python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('retCode')==0, d.get('retMsg')" "$f" || { echo "bad reply: $f"; exit 1; }; done
      - name: Print the tables
        # The artifact store is out of reach from the build sessions, so the same public replies also go to the log.
        run: for f in out/read-at.txt out/*.json; do echo "=== $(basename "$f")"; cat "$f"; echo; done
      - uses: actions/upload-artifact@v4
        with:
          name: venue-tables
          path: out/
          retention-days: 30
