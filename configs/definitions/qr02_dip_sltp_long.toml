# QR-B4 trend filter + dip family, SL/TP exit-set try (21 Oct 2026, Quant Researcher). Decision candle: 4h.
# Variant of qr02_dip_long, pre-registered before any run (PM 21 Oct 14:42-14:44 UK: every strategy carries an explicit
# stop-loss and take-profit; values are the mr type's convention, Advisor 21 Oct, never tuned per strategy).
# take_profit needs TP-EXIT (Deploy 2): syntax provisional until it is live.
version = 1
name = "qr02-dip-sltp-long"
title = "Trend Pullback (buy the dip, 4h) + SL/TP · Long"
reason = """qr02_dip_long with the mean-reversion take-profit added, resting at the 20-candle average (the parent's own stop kept); whichever exit fires first wins. Entry, the RSI and 5-candle-average exits and the 10-candle time stop unchanged; the parent's own 2.5 ATR stop is kept (Advisor: the type's stop applies only where a parent has none), so R is measured from it. The nearer 5-candle exit will usually fire first; exits are counted by kind. Held at 1x."""

[blocks.trend]
kind = "sma"
period = 200
timeframe = "1d"

[blocks.rsi]
kind = "rsi"
period = 2

[blocks.sma5]
kind = "sma"
period = 5

[blocks.sma20]
kind = "sma"
period = 20

[blocks.atr]
kind = "atr"
period = 14

[long]
entry = { all = [
    { left = "close", op = ">", right = "trend" },
    { left = "rsi", op = "<", right = 10 },
] }
exit = { any = [
    { left = "rsi", op = ">", right = 70 },
    { left = "close", op = ">", right = "sma5" },
] }

[exits]
stop = { level = { sub = ["close", { mul = [2.5, "atr"] }] } }
take_profit = { level = "sma20" }
time_stop = { bars = 10 }
