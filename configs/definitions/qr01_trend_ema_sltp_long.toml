# QR-B1 family, SL/TP exit-set try (21 Oct 2026, Quant Researcher). Decision candle: 4h.
# Variant of qr01_trend_ema_long, pre-registered before any run (PM 21 Oct 14:42-14:44 UK: every strategy carries an explicit
# stop-loss and take-profit; values are the trend type's convention, Advisor 21 Oct, never tuned per strategy).
# take_profit needs TP-EXIT (Deploy 2): syntax provisional until it is live.
version = 1
name = "qr01-trend-ema-sltp-long"
title = "Trend Cross (21/55, 4h) + SL/TP · Long"
reason = """qr01_trend_ema_long with the trend exit set: 3 ATR(14) stop at entry, fixed 3R take-profit, 3 ATR(14) trail that only tightens; whichever exit fires first wins. Entry and signal exit unchanged (the entry is already a cross, so a stopped trade waits for a fresh cross). Held at 1x."""

[blocks.fast]
kind = "ema"
period = 21

[blocks.slow]
kind = "ema"
period = 55

[blocks.atr]
kind = "atr"
period = 14

[long]
entry = { left = "fast", op = "crosses_above", right = "slow" }
exit = { left = "fast", op = "<", right = "slow" }

[exits]
stop = { level = { sub = ["close", { mul = [3.0, "atr"] }] } }
take_profit = { r = 3.0 }
trail = { level = { sub = ["close", { mul = [3.0, "atr"] }] }, ratchet = true }
