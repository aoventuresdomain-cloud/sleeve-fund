# Pre-registered variant V4 of qr01b, "shorts only in a down market" (improve loop round 2, Researcher 24 Oct, Advisor
# cleared): an exact copy of V3 (qr01b_trend_multispeed_ls_v3_adx) with one change, no new short unless the last
# completed daily close is below its 200-day average. Both are read from the last completed day (1d blocks); while the
# average has no value (its first 200 days) no short opens. Longs, exits, stops and candles are V3's.
version = 1
name = "qr01b-trend-multispeed-ls-v4-short-sma200"
title = "Trend Consensus (3 speeds, 4h) · Long and Short · ADX filter · shorts below SMA200"
reason = """Three EMA pairs (8/32, 16/64, 32/128) each vote on the trend, so no single setting decides. Go long when
all three agree up, short when all three agree down, leave when two of the three turn; 3 ATR(14) stop. No new entry
while daily ADX(14) is above 25: the in-sample regime split found the strong-trend entries lost money.
V3 plus one rule: shorts only in a down market. The V3 short leg made money in 2022, when the price was below its long
average, and lost in the 2023 to 2025 uptrend."""

[blocks.f1]
kind = "ema"
period = 8

[blocks.s1]
kind = "ema"
period = 32

[blocks.f2]
kind = "ema"
period = 16

[blocks.s2]
kind = "ema"
period = 64

[blocks.f3]
kind = "ema"
period = 32

[blocks.s3]
kind = "ema"
period = 128

[blocks.atr]
kind = "atr"
period = 14

[blocks.adx]
kind = "adx"
period = 14
timeframe = "1d"

[blocks.close1d]  # the last completed daily close: a one-day average on daily candles
kind = "sma"
period = 1
timeframe = "1d"

[blocks.sma200d]
kind = "sma"
period = 200
timeframe = "1d"

[long]
reverse = true  # flip on the signal candle: a close and an open, each with its fee and half spread (Advisor 24 Oct)
entry = { all = [
    { left = "f1", op = ">", right = "s1" },
    { left = "f2", op = ">", right = "s2" },
    { left = "f3", op = ">", right = "s3" },
    { left = "adx", op = "<=", right = 25, no_value = "pass" },
] }
exit = { any = [
    { all = [{ left = "f1", op = "<", right = "s1" }, { left = "f2", op = "<", right = "s2" }] },
    { all = [{ left = "f1", op = "<", right = "s1" }, { left = "f3", op = "<", right = "s3" }] },
    { all = [{ left = "f2", op = "<", right = "s2" }, { left = "f3", op = "<", right = "s3" }] },
] }

[short]
reverse = true
entry = { all = [
    { left = "f1", op = "<", right = "s1" },
    { left = "f2", op = "<", right = "s2" },
    { left = "f3", op = "<", right = "s3" },
    { left = "adx", op = "<=", right = 25, no_value = "pass" },
    { left = "close1d", op = "<", right = "sma200d" },  # no value yet: fails, so no short
] }
exit = { any = [
    { all = [{ left = "f1", op = ">", right = "s1" }, { left = "f2", op = ">", right = "s2" }] },
    { all = [{ left = "f1", op = ">", right = "s1" }, { left = "f3", op = ">", right = "s3" }] },
    { all = [{ left = "f2", op = ">", right = "s2" }, { left = "f3", op = ">", right = "s3" }] },
] }

[exits.long]
stop = { level = { sub = ["close", { mul = [3.0, "atr"] }] } }

[exits.short]
stop = { level = { add = ["close", { mul = [3.0, "atr"] }] } }
