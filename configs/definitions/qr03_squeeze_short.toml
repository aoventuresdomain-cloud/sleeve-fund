# QR top 3, #3 squeeze breakout, short leg (half risk). Decision candle: 1h.
version = 1
name = "qr03-squeeze-short"
title = "Squeeze Breakout (1h) · Short"
reason = """Mirror of the long leg: after a Bollinger-inside-Keltner squeeze, sell a close below the last 20 candles'
low on at least 1.5 x normal volume within 10 candles. Out on a 2.5 ATR trailing stop, a close back above the
channel's middle, or after 48 hours; initial stop 2 ATR."""

[blocks.bb]
kind = "bollinger"
period = 20
k = 2.0

[blocks.kc]
kind = "keltner"
period = 20
atr_period = 20
k = 1.5

[blocks.dc]
kind = "donchian"
period = 20

[blocks.rvol]
kind = "relative_volume"
period = 20

[blocks.atr]
kind = "atr"
period = 14

[short]
entry = { setup = { all = [
    { left = "bb.upper", op = "<", right = "kc.upper" },
    { left = "bb.lower", op = ">", right = "kc.lower" },
] }, trigger = { all = [
    { left = "close", op = "<", right = { prev = "dc.lower" } },
    { left = "rvol", op = ">=", right = 1.5 },
] }, expire_after = { bars = 10, timeframe = "1h" } }
exit = { left = "close", op = ">", right = "dc.mid" }
breakout = true

[exits]
time_stop = { minutes = 2880 }
stop = { level = { add = ["close", { mul = [2.0, "atr"] }] } }
trail = { level = { add = ["close", { mul = [2.5, "atr"] }] }, ratchet = true }

[costs]
breakout_slippage_bp = 5
