# QR-B3 family, SL/TP exit-set try (21 Oct 2026, Quant Researcher). Decision candle: 1d.
# Variant of qr01d_trend_donchian20_long, pre-registered before any run (PM 21 Oct 14:42-14:44 UK: every strategy carries an explicit
# stop-loss and take-profit; values are the trend type's convention, Advisor 21 Oct, never tuned per strategy).
# take_profit needs TP-EXIT (Deploy 2): syntax provisional until it is live.
version = 1
name = "qr01d-trend-donchian20-sltp-long"
title = "Channel Breakout Trend (20-day, daily) + SL/TP · Long"
reason = """qr01d_trend_donchian20_long with the trend exit set: 3 ATR(14) stop at entry, fixed 3R take-profit, 3 ATR(14) trail that only tightens; whichever exit fires first wins. The parent's 10-day channel exit stays resting (as exit_at_level; the engine takes the tightest of stop, trail and channel); the entry is a fresh close through the prior 20-day high, so it re-arms. Held at 1x."""

[blocks.entry_dc]
kind = "donchian"
period = 20

[blocks.exit_dc]
kind = "donchian"
period = 10

[blocks.atr]
kind = "atr"
period = 14

[long]
entry = { left = "close", op = "crosses_above", right = { prev = "entry_dc.upper" } }
breakout = true

[costs]
breakout_slippage_bp = 5

[exits]
stop = { level = { sub = ["close", { mul = [3.0, "atr"] }] } }
take_profit = { r = 3.0 }
trail = { level = { sub = ["close", { mul = [3.0, "atr"] }] }, ratchet = true }
exit_at_level = { level = "exit_dc.lower" }
