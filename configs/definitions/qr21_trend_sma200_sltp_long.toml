# QR-B12 family, SL/TP exit-set try (21 Oct 2026, Quant Researcher). Decision candle: 1d.
# Variant of qr21_trend_sma200_long, pre-registered before any run (PM 21 Oct 14:42-14:44 UK: every strategy carries an explicit
# stop-loss and take-profit; values are the trend type's convention, Advisor 21 Oct, never tuned per strategy).
# take_profit needs TP-EXIT (Deploy 2): syntax provisional until it is live.
version = 1
name = "qr21-trend-sma200-sltp-long"
title = "200-Day Trend (daily) + SL/TP · Long"
reason = """qr21_trend_sma200_long with the trend exit set: 3 ATR(14) stop at entry, fixed 3R take-profit, 3 ATR(14) trail that only tightens; whichever exit fires first wins. Entry is a cross above the average (as qr21b) so it re-arms; signal exit unchanged. QR-B12 try 8. Held at 1x."""

[blocks.sma]
kind = "sma"
period = 200

[blocks.atr]
kind = "atr"
period = 14

[long]
entry = { left = "close", op = "crosses_above", right = "sma" }
exit = { left = "close", op = "<", right = "sma" }

[exits]
stop = { level = { sub = ["close", { mul = [3.0, "atr"] }] } }
take_profit = { r = 3.0 }
trail = { level = { sub = ["close", { mul = [3.0, "atr"] }] }, ratchet = true }
