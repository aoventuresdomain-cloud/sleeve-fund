# QR #1 variant (bench): Donchian channel trend, long leg. Decision candle: 1d.
version = 1
name = "qr01c-trend-donchian-long"
title = "Channel Breakout Trend (55-day, daily) · Long"
reason = """The turtle rule: buy a close above the highest high of the last 55 days, hold with a stop that only
tightens at the lowest low of the last 20 days, so the trend premium is entered on breakouts."""

[blocks.entry_dc]
kind = "donchian"
period = 55

[blocks.exit_dc]
kind = "donchian"
period = 20

[long]
entry = { left = "close", op = ">", right = { prev = "entry_dc.upper" } }
breakout = true

[exits]
trail = { level = "exit_dc.lower", ratchet = true }

[costs]
breakout_slippage_bp = 5
