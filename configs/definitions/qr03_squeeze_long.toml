# QR top 3, #3 squeeze breakout, long leg. Decision candle: 1h.
# The squeeze is the classic test (Bollinger bands inside Keltner channels), now that Keltner is in the library; the
# earlier card's "Bollinger width at its 120-bar low" needs a rolling-minimum block the builder doesn't have.
version = 1
name = "qr03-squeeze-long"
reason = """Calm periods are followed by big moves (volatility clustering). When the Bollinger(20, 2) bands sit inside
the Keltner(20, 1.5 ATR) channel the market is coiled; buy a close above the last 20 candles' high, on at least
1.5 x normal volume, within 10 candles of the squeeze. Out on a 2.5 ATR trailing stop, a close back below the
channel's middle, or after 48 hours; initial stop 2 ATR."""

[blocks.bb]
kind = "bollinger"
period = 20
k = 2.0

[blocks.kc]
kind = "keltner"
period = 20
atr_period = 20
k = 1.5

[blocks.dc]
kind = "donchian"
period = 20

[blocks.rvol]
kind = "relative_volume"
period = 20

[blocks.atr]
kind = "atr"
period = 14

[long]
entry = { setup = { all = [
    { left = "bb.upper", op = "<", right = "kc.upper" },
    { left = "bb.lower", op = ">", right = "kc.lower" },
] }, trigger = { all = [
    { left = "close", op = ">", right = { prev = "dc.upper" } },
    { left = "rvol", op = ">=", right = 1.5 },
] }, expire_after = { bars = 10, timeframe = "1h" } }
exit = { left = "close", op = "<", right = "dc.mid" }
breakout = true

[exits]
time_stop = { minutes = 2880 }
stop = { level = { sub = ["close", { mul = [2.0, "atr"] }] } }
trail = { level = { sub = ["close", { mul = [2.5, "atr"] }] }, ratchet = true }

[costs]
breakout_slippage_bp = 5
