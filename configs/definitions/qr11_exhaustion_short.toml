# QR bench: exhaustion reversal (PM's RSI 85/70 idea), short leg. Decision candle: 15m, setup on 1h.
# Must be judged against the opposite trade (long after the same setup), because overbought often keeps rising here.
version = 1
name = "qr11-exhaustion-short"
reason = """After an extreme run (1h RSI(14) above 85 on 2 x normal 1h volume) late buyers run out; sell when 15m
RSI(14) falls back below 70 within four hours of the setup. Cover at the 15m Bollinger(20, 2) middle, or after 12
hours; stop 1.5 ATR(14) above the entry close."""

[blocks.rsi1h]
kind = "rsi"
period = 14
timeframe = "1h"

[blocks.rvol1h]
kind = "relative_volume"
period = 20
timeframe = "1h"

[blocks.rsi]
kind = "rsi"
period = 14

[blocks.bb]
kind = "bollinger"
period = 20
k = 2.0

[blocks.atr]
kind = "atr"
period = 14

[short]
entry = { setup = { all = [
    { left = "rsi1h", op = ">", right = 85 },
    { left = "rvol1h", op = ">=", right = 2.0 },
] }, trigger = { left = "rsi", op = "crosses_below", right = 70 }, expire_after = { bars = 4, timeframe = "1h" } }
exit = { left = "close", op = "<=", right = "bb.mid" }

[exits]
time_stop = { minutes = 720 }
stop = { level = { add = ["close", { mul = [1.5, "atr"] }] } }
