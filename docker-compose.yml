# The fund on one machine: database, sleeve supervisor, dashboard, HTTPS.
# Kraken keys for live accounts, if any, live only in kraken.env on the server, which only the
# supervisor reads. The dashboard never sees a key; it shows whether one is present.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sleeve_fund
      POSTGRES_USER: sleeve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleeve -d sleeve_fund"]
      interval: 5s
      retries: 20

  supervisor:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://sleeve:${POSTGRES_PASSWORD}@db:5432/sleeve_fund
      HISTORY_DIR: /data/history  # warm-up for sleeves on bars built from live trades
      # Optional: where warnings and errors are sent, and an outside monitor's ping (sleeve_fund/alerts.py).
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      HEALTHCHECK_PING_URL: ${HEALTHCHECK_PING_URL:-}
      BACKUP_DIR: /data/backups  # read only: a late or failed backup raises an alert
    volumes: [history:/data/history:ro, backups:/data/backups:ro]
    env_file:
      - path: kraken.env
        required: false
    command: sh -c "python -m sleeve_fund.supervisor clear configs/clear.toml && python -m sleeve_fund.supervisor seed configs/sleeves/*.toml && python -m sleeve_fund.supervisor run"

  # A compressed dump of the journal every night, proved by restoring it into a scratch database,
  # the newest 14 good ones kept (deploy/backup.sh). Lightsail's automatic snapshots copy the server.
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [backups:/backups, research:/research:ro, ./deploy/backup.sh:/backup.sh:ro]
    entrypoint: ["bash", "/backup.sh"]

  # Keeps every instrument's minute history current from its venue, into the shared store that
  # research and the backtest page read. Public market data only, no keys.
  history:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://sleeve:${POSTGRES_PASSWORD}@db:5432/sleeve_fund
      HISTORY_DIR: /data/history
    volumes: [history:/data/history]
    command: python -m sleeve_fund.history run

  # The same store for Binance USD-M perpetuals (public data, no key): prices and settled funding.
  history-binance:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://sleeve:${POSTGRES_PASSWORD}@db:5432/sleeve_fund
      HISTORY_DIR: /data/history
    volumes: [history:/data/history]
    command: python -m sleeve_fund.history run --venue binance

  # Copies the fills of strategies with demo_mirror = true to a demo account (sleeve_fund/mirror.py): Binance
  # Demo Trading for strategies on Binance, the Deribit TESTNET for the rest. The only service given the demo
  # keys, and it refuses any other host or credential; off quietly unless DEMO_MIRROR is on and a demo
  # account's key and secret are both set. Paper is unaffected.
  mirror:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://sleeve:${POSTGRES_PASSWORD}@db:5432/sleeve_fund
      DEMO_MIRROR: ${DEMO_MIRROR:-}
      DERIBIT_TESTNET_API_KEY: ${DERIBIT_TESTNET_API_KEY:-}
      DERIBIT_TESTNET_API_SECRET: ${DERIBIT_TESTNET_API_SECRET:-}
      BINANCE_DEMO_API_KEY: ${BINANCE_DEMO_API_KEY:-}
      BINANCE_DEMO_API_SECRET: ${BINANCE_DEMO_API_SECRET:-}
    command: python -m sleeve_fund.mirror run

  dashboard:
    build: .
    restart: unless-stopped
    # The pages plus one backtest at a time, each in its own process (5 years of 1-minute bars
    # peaked at 0.54 GB). A run past this is stopped and says so; the pages carry on.
    mem_limit: 1536m
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://sleeve:${POSTGRES_PASSWORD}@db:5432/sleeve_fund
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env}
      HISTORY_DIR: /data/history
      BACKUP_DIR: /data/backups  # read only, to show the newest backup on the Operations page
      # Studies run from the Research page, and the idea counter, kept apart from the code each deploy replaces.
      IDEA_LEDGER: /data/research/idea_ledger.jsonl
      TEARSHEET_DIR: /data/research/tearsheets
    volumes: [history:/data/history:ro, backups:/data/backups:ro, research:/data/research]
    command: uvicorn --factory sleeve_fund.dashboard.app:create_app --host 0.0.0.0 --port 8000 --proxy-headers

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [dashboard]
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  backups:
  history:
  research:
  pgdata:
  caddy_data:
