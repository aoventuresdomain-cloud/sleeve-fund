{% macro stepper(stage, stages, observation=False) %}<ol class="stepper" aria-label="Stage {{ stage + 1 }} of {{ stages|length }}: {{ stages[stage] }}">{% for st in stages %}<li class="{{ 'done' if loop.index0 < stage else ('now' if loop.index0 == stage else '') }}{{ ' obs' if observation and loop.index0 == stage }}" title="{{ st }}"><span>{{ st }}</span></li>{% endfor %}</ol>{% endmacro %}
