{% macro chip(status) %}<span class="chip {{ status }}">{{ status|capitalize }}</span>{% endmacro %}
{% macro signed(x) %}<span class="{{ 'gain' if x >= 0 else 'loss' }}">{{ x|pct }}</span>{% endmacro %}
{% macro money_signed(x) %}<span class="{{ 'gain' if x > 0.005 else ('loss' if x < -0.005 else 'muted') }}">{{ x|smoney }}</span>{% endmacro %}
{% macro usage(f) %}<span class="meter {{ 'high' if f >= 0.8 else ('mid' if f >= 0.5 else '') }}" role="img" aria-label="{{ (f * 100)|round(0)|int }}% of limit used"><i style="width: {{ (f * 100)|round(0) }}%"></i></span>{% endmacro %}
{% macro spark(points, up) %}{% if points %}<svg class="spark {{ '' if up else 'down' }}" width="96" height="24" viewBox="0 0 96 24" aria-hidden="true"><polyline points="{{ points }}"/></svg>{% else %}<span class="faint">no history</span>{% endif %}{% endmacro %}
